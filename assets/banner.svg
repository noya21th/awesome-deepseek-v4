<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="awesome-deepseek-v4: community multilingual resource hub for DeepSeek V4">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f1738"/>
      <stop offset="100%" stop-color="#1a1550"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Soft glow behind right-side pattern -->
  <circle cx="980" cy="150" r="220" fill="url(#glow)"/>

  <!-- Right-side abstract "experts" grid: 18x6 dots, a few highlighted.
       Visually suggests a Mixture-of-Experts topology without using any
       third-party branding. -->
  <g transform="translate(760, 60)">
    <!-- Generated 18 x 6 grid, spacing 22px, dot r=4 -->
    <g fill="#334155">
      <circle cx="0"   cy="0"   r="4"/><circle cx="22"  cy="0"   r="4"/><circle cx="44"  cy="0"   r="4"/><circle cx="66"  cy="0"   r="4"/><circle cx="88"  cy="0"   r="4"/><circle cx="110" cy="0"   r="4"/><circle cx="132" cy="0"   r="4"/><circle cx="154" cy="0"   r="4"/><circle cx="176" cy="0"   r="4"/><circle cx="198" cy="0"   r="4"/><circle cx="220" cy="0"   r="4"/><circle cx="242" cy="0"   r="4"/><circle cx="264" cy="0"   r="4"/><circle cx="286" cy="0"   r="4"/><circle cx="308" cy="0"   r="4"/><circle cx="330" cy="0"   r="4"/><circle cx="352" cy="0"   r="4"/><circle cx="374" cy="0"   r="4"/>
      <circle cx="0"   cy="22"  r="4"/><circle cx="22"  cy="22"  r="4"/><circle cx="44"  cy="22"  r="4"/><circle cx="66"  cy="22"  r="4"/><circle cx="88"  cy="22"  r="4"/><circle cx="110" cy="22"  r="4"/><circle cx="132" cy="22"  r="4"/><circle cx="154" cy="22"  r="4"/><circle cx="176" cy="22"  r="4"/><circle cx="198" cy="22"  r="4"/><circle cx="220" cy="22"  r="4"/><circle cx="242" cy="22"  r="4"/><circle cx="264" cy="22"  r="4"/><circle cx="286" cy="22"  r="4"/><circle cx="308" cy="22"  r="4"/><circle cx="330" cy="22"  r="4"/><circle cx="352" cy="22"  r="4"/><circle cx="374" cy="22"  r="4"/>
      <circle cx="0"   cy="44"  r="4"/><circle cx="22"  cy="44"  r="4"/><circle cx="44"  cy="44"  r="4"/><circle cx="66"  cy="44"  r="4"/><circle cx="88"  cy="44"  r="4"/><circle cx="110" cy="44"  r="4"/><circle cx="132" cy="44"  r="4"/><circle cx="154" cy="44"  r="4"/><circle cx="176" cy="44"  r="4"/><circle cx="198" cy="44"  r="4"/><circle cx="220" cy="44"  r="4"/><circle cx="242" cy="44"  r="4"/><circle cx="264" cy="44"  r="4"/><circle cx="286" cy="44"  r="4"/><circle cx="308" cy="44"  r="4"/><circle cx="330" cy="44"  r="4"/><circle cx="352" cy="44"  r="4"/><circle cx="374" cy="44"  r="4"/>
      <circle cx="0"   cy="66"  r="4"/><circle cx="22"  cy="66"  r="4"/><circle cx="44"  cy="66"  r="4"/><circle cx="66"  cy="66"  r="4"/><circle cx="88"  cy="66"  r="4"/><circle cx="110" cy="66"  r="4"/><circle cx="132" cy="66"  r="4"/><circle cx="154" cy="66"  r="4"/><circle cx="176" cy="66"  r="4"/><circle cx="198" cy="66"  r="4"/><circle cx="220" cy="66"  r="4"/><circle cx="242" cy="66"  r="4"/><circle cx="264" cy="66"  r="4"/><circle cx="286" cy="66"  r="4"/><circle cx="308" cy="66"  r="4"/><circle cx="330" cy="66"  r="4"/><circle cx="352" cy="66"  r="4"/><circle cx="374" cy="66"  r="4"/>
      <circle cx="0"   cy="88"  r="4"/><circle cx="22"  cy="88"  r="4"/><circle cx="44"  cy="88"  r="4"/><circle cx="66"  cy="88"  r="4"/><circle cx="88"  cy="88"  r="4"/><circle cx="110" cy="88"  r="4"/><circle cx="132" cy="88"  r="4"/><circle cx="154" cy="88"  r="4"/><circle cx="176" cy="88"  r="4"/><circle cx="198" cy="88"  r="4"/><circle cx="220" cy="88"  r="4"/><circle cx="242" cy="88"  r="4"/><circle cx="264" cy="88"  r="4"/><circle cx="286" cy="88"  r="4"/><circle cx="308" cy="88"  r="4"/><circle cx="330" cy="88"  r="4"/><circle cx="352" cy="88"  r="4"/><circle cx="374" cy="88"  r="4"/>
      <circle cx="0"   cy="110" r="4"/><circle cx="22"  cy="110" r="4"/><circle cx="44"  cy="110" r="4"/><circle cx="66"  cy="110" r="4"/><circle cx="88"  cy="110" r="4"/><circle cx="110" cy="110" r="4"/><circle cx="132" cy="110" r="4"/><circle cx="154" cy="110" r="4"/><circle cx="176" cy="110" r="4"/><circle cx="198" cy="110" r="4"/><circle cx="220" cy="110" r="4"/><circle cx="242" cy="110" r="4"/><circle cx="264" cy="110" r="4"/><circle cx="286" cy="110" r="4"/><circle cx="308" cy="110" r="4"/><circle cx="330" cy="110" r="4"/><circle cx="352" cy="110" r="4"/><circle cx="374" cy="110" r="4"/>
    </g>
    <!-- 6 highlighted "active experts" matching V4's top-6 routing -->
    <g>
      <circle cx="88"  cy="22"  r="5" fill="#7dd3fc"/>
      <circle cx="198" cy="0"   r="5" fill="#a78bfa"/>
      <circle cx="264" cy="66"  r="5" fill="#f472b6"/>
      <circle cx="44"  cy="88"  r="5" fill="#34d399"/>
      <circle cx="330" cy="44"  r="5" fill="#fbbf24"/>
      <circle cx="154" cy="110" r="5" fill="#f87171"/>
    </g>
  </g>

  <!-- Title -->
  <text x="60" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.5">awesome-deepseek-v4</text>

  <!-- Accent underline bar under title -->
  <rect x="60" y="110" width="320" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="60" y="148" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#cbd5e1">Community multilingual hub · recipes, benchmarks, deployment, migration</text>
  <text x="60" y="172" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">English · 简体中文 · Français · العربية · 日本語 · Deutsch · हिन्दी</text>

  <!-- Info pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">
    <g transform="translate(60, 210)">
      <rect width="168" height="34" rx="17" fill="rgba(125, 211, 252, 0.12)" stroke="#7dd3fc" stroke-width="1"/>
      <text x="84" y="22" text-anchor="middle" fill="#7dd3fc">1.6 T params · 49 B active</text>
    </g>
    <g transform="translate(240, 210)">
      <rect width="130" height="34" rx="17" fill="rgba(167, 139, 250, 0.12)" stroke="#a78bfa" stroke-width="1"/>
      <text x="65" y="22" text-anchor="middle" fill="#a78bfa">1 M context</text>
    </g>
    <g transform="translate(382, 210)">
      <rect width="130" height="34" rx="17" fill="rgba(244, 114, 182, 0.12)" stroke="#f472b6" stroke-width="1"/>
      <text x="65" y="22" text-anchor="middle" fill="#f472b6">MIT · commercial</text>
    </g>
    <g transform="translate(524, 210)">
      <rect width="130" height="34" rx="17" fill="rgba(52, 211, 153, 0.12)" stroke="#34d399" stroke-width="1"/>
      <text x="65" y="22" text-anchor="middle" fill="#34d399">7 languages</text>
    </g>
  </g>

  <!-- Unobtrusive "unofficial" marker, bottom right -->
  <text x="1140" y="282" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">unofficial · community-maintained</text>
</svg>
